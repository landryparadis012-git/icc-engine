name: ICC isolated tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline tests
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile engine/engine.py engine/pressure.py engine/news_context.py
