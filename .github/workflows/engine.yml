name: ICC Engine Scan

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # OpsHub triggers this repo with a repository_dispatch (type: icc.run).
  repository_dispatch:
    types: [icc.run, opshub.run]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fail fast: the risk firewall, config-integrity and open-funnel tests run
      # before any scan, so a broken guard can never reach production state.
      - name: Unit + integration tests
        run: python -m unittest discover -s tests -v

      - name: Main engine scan
        run: python engine/engine.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Button presses recorded by OpsHub (POST /acks) are applied at scan start
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}

      - name: Pressure scan (V3)
        run: python engine/pressure.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sync events to OpsHub
        run: python engine/hub_sync.py
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}

      - name: Commit memory
        run: |
          git config user.name "icc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "memory update [skip ci]"
          git push
