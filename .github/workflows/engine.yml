name: ICC Engine Scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # OpsHub triggers this repo with a repository_dispatch (type: icc.run).
  repository_dispatch:
    types: [icc.run, icc.news_guard, opshub.run]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test scan health gate
        run: python -m py_compile engine/scan_health.py engine/engine.py engine/pressure.py engine/hub_sync.py tests/test_scan_health.py && python -m unittest discover -s tests -v

  scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Main engine scan
        run: |
          set -o pipefail
          python engine/engine.py 2>&1 | tee main_scan.log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Button presses recorded by OpsHub (POST /acks) are applied at scan start
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}

      - name: Pressure scan (V3)
        run: python engine/pressure.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sync events to OpsHub
        run: python engine/hub_sync.py
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}

      - name: Fail workflow when no symbols were analysed
        if: always()
        run: python engine/scan_health.py main_scan.log

      - name: Commit memory
        run: |
          git config user.name "icc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "memory update [skip ci]"
          git push
